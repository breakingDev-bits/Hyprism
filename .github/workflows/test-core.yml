name: Core Tests

on:
  workflow_call:

permissions:
  contents: read

env:
  DOTNET_VERSION: '10.0.x'
  DOTNET_QUALITY: 'preview'

jobs:
  tests:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Linux
            runner: ubuntu-24.04
          - platform: Windows
            runner: windows-2025
          - platform: macOS
            runner: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          dotnet-quality: ${{ env.DOTNET_QUALITY }}

      - name: Run Core tests
        run: dotnet test Tests/Hyprism.Core.Tests/Hyprism.Core.Tests.csproj --configuration Release --logger "trx;LogFileName=core-${{ matrix.platform }}.trx" --results-directory "${{ runner.temp }}/hyprism-test-results"

      - name: Write test summary
        if: always()
        shell: pwsh
        run: >
          pwsh -NoProfile -File ./Scripts/write-test-summary.ps1
          -ResultsDirectory "${{ runner.temp }}/hyprism-test-results"
          -Title "Core tests (${{ matrix.platform }})"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-test-results-${{ matrix.platform }}
          path: ${{ runner.temp }}/hyprism-test-results/*.trx
          if-no-files-found: ignore
